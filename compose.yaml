name: ris-practice

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ris
      POSTGRES_PASSWORD: ris
      POSTGRES_DB: ris
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ris -d ris"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
