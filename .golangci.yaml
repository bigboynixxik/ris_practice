version: "2"
linters:
  default: none
  enable:
    - bodyclose
    - depguard
    - err113
    - errcheck
    - errorlint
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - noctx
    - revive
    - sqlclosecheck
    - staticcheck
  settings:
    depguard:
      rules:
        models-layer:
          files:
            - '**/internal/models/**/*.go'
          allow:
            - $gostd
            - github.com/google/uuid
          deny:
            - pkg: github.com/jackc/pgx
            - pkg: github.com/Masterminds/squirrel
    gocyclo:
      min-complexity: 15
    govet:
      disable:
        - fieldalignment
      enable-all: true
  exclusions:
    generated: lax
    rules:
      - linters:
          - bodyclose
          - err113
          - gosec
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - ris
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
